name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Perfil default, SIN bibliotecas de ZIM.
          # Este job es el que demuestra la independencia: si alguien reintroduce
          # una dependencia dura de libzim sin gatearla, falla en la compilación
          # — no en el enlace de una biblioteca que ya estaba instalada.
          - perfil: default
            paquetes: libssl-dev pkg-config
            features: ""
          # Perfil con la capacidad ZIM compilada.
          - perfil: con-zim
            paquetes: libssl-dev pkg-config libzim-dev
            features: --features zim
    defaults:
      run:
        working-directory: edu-conect-rural-server

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            edu-conect-rural-server/target
          key: ${{ runner.os }}-cargo-${{ matrix.perfil }}-${{ hashFiles('edu-conect-rural-server/Cargo.lock') }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.paquetes }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy ${{ matrix.features }} -- -D warnings

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      - name: Run tests
        run: cargo test --lib --bins --test integration_test ${{ matrix.features }} -- --nocapture

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t educonect-rural .

      - name: Verify image starts
        run: |
          docker run -d --name educonect-test -p 8080:8080 \
            -e JWT_SECRET=test-secreto-para-ci \
            educonect-rural
          sleep 10
          curl -sf http://localhost:8080/health || exit 1
          echo "✅ Health check passed!"
          docker stop educonect-test
