services:
  educonect:
    build: .
    container_name: educonect-rural
    ports:
      - "8080:8080"
    volumes:
      # Persistir DB y todo el contenido mutable bajo /data
      - educonect-data:/data
    environment:
      - "JWT_SECRET=${JWT_SECRET:?Crea un archivo .env con un JWT_SECRET seguro}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  educonect-data:
