<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuestionarios — EduConect</title>
<style>:root{--ink:#3d2c20;--muted:#846f5d;--terr:#c45a3c;--paper:#fdf8f0;--card:#fff;--line:#eadfce;--green:#3d7951}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,calc((100% - 1180px)/2));background:#fff;border-bottom:1px solid var(--line)}a{color:var(--terr);text-decoration:none;font-weight:700}main{max-width:1180px;margin:auto;padding:24px 16px}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px}.hero h1{margin:0;font-size:clamp(1.6rem,4vw,2.5rem)}button{border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--terr);color:#fff}.secondary{background:#f3e9dc;color:var(--ink)}.danger{background:#fff0ed;color:#a52f23}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.quiz-card,.question{padding:13px;border:1px solid var(--line);border-radius:11px;margin-top:10px}.quiz-card{cursor:pointer}.quiz-card:hover{border-color:var(--terr);background:#fff7f2}.quiz-card h3{margin:0}.meta{color:var(--muted);font-size:.82rem}.field{display:grid;gap:5px;margin:12px 0}.field label{font-weight:700}.field input,.field textarea,.field select,.question input,.question select{width:100%;padding:10px;border:1px solid #d9cbb9;border-radius:8px;background:#fff;font:inherit}.question-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.question-grid{display:grid;grid-template-columns:2fr 1fr 90px;gap:8px}.options{display:grid;gap:7px;margin-top:8px}.option{display:grid;grid-template-columns:1fr 34px;gap:6px}.empty{padding:30px 10px;text-align:center;color:var(--muted)}#notice{min-height:22px;font-weight:700}.ok{color:var(--green)}.error{color:#a52f23}@media(max-width:780px){.layout{grid-template-columns:1fr}.question-grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}</style></head>
<body><header><a href="/profesor/">← Panel del Profesor</a><strong>🎯 Banco de cuestionarios</strong><button id="logout" class="secondary">Cerrar sesión</button></header>
<main><section class="hero"><div><h1>Cuestionarios interactivos</h1><p class="meta">Crea actividades offline inspiradas en Quizly.</p></div><div class="toolbar"><button id="importBtn" class="secondary">Importar JSON</button><button id="newBtn" class="primary">＋ Nuevo</button></div></section>
<div id="notice"></div><div class="layout"><aside class="panel"><div class="field"><input id="search" type="search" placeholder="Buscar cuestionario…"></div><div id="list"><div class="empty">Cargando…</div></div></aside><section class="panel"><form id="editor"><input id="quizId" type="hidden"><div class="field"><label>Título</label><input id="title" maxlength="160" required></div><div class="field"><label>Tema</label><input id="theme" maxlength="80" value="General"></div><div class="field"><label>Descripción</label><textarea id="description" maxlength="500" rows="2"></textarea></div><div class="toolbar"><strong style="margin-right:auto">Preguntas</strong><select id="newType"><option value="choice">Selección única</option><option value="truefalse">Verdadero/Falso</option><option value="multi">Selección múltiple</option><option value="order">Ordenar</option><option value="numeric">Numérica</option><option value="fill">Completar</option></select><button type="button" id="addQuestion" class="secondary">＋ Agregar</button></div><div id="questions"></div><div class="toolbar"><button class="primary" type="submit">Guardar</button><button class="secondary" type="button" id="exportBtn">Exportar JSON</button><button class="secondary" type="button" id="duplicateBtn">Duplicar</button><button class="danger" type="button" id="deleteBtn">Eliminar</button></div></form></section></div></main><input id="file" type="file" accept="application/json,.json" hidden>
<script src="/js/profesor-quizzes.js"></script></body></html>
